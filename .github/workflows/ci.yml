name: Android Platform CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Detekt Standards Check
        run: ./gradlew detekt

      - name: Run Unit & Robolectric Tests
        run: ./gradlew test

      - name: Compile Debug Package
        run: ./gradlew assembleDebug
